<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Clicker Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px rgba(0,0,0,0.4);
    width:400px;
}

h1{
    margin-bottom:20px;
}

#score{
    font-size:60px;
    font-weight:bold;
    margin:20px 0;
    color:#38bdf8;
}

.click-btn{
    width:180px;
    height:180px;
    border:none;
    border-radius:50%;
    background:linear-gradient(45deg,#38bdf8,#2563eb);
    color:white;
    font-size:28px;
    cursor:pointer;
    transition:.15s;
    box-shadow:0 0 20px rgba(56,189,248,.5);
}

.click-btn:hover{
    transform:scale(1.05);
}

.click-btn:active{
    transform:scale(0.95);
}

.shop{
    margin-top:30px;
}

.upgrade{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.info{
    margin-top:15px;
    color:#cbd5e1;
}
</style>
</head>
<body>

<div class="container">

    <h1>🚀 Click Empire</h1>

    <div id="score">0</div>

    <button class="click-btn" onclick="clickPoint()">
        CLICK
    </button>

    <div class="shop">
        <button class="upgrade" onclick="buyAuto()">
            🤖 Acheter AutoClicker (50)
        </button>

        <div class="info">
            AutoClickers : <span id="autos">0</span>
        </div>
    </div>

</div>

<script>
let score = 0;
let autoClickers = 0;
let autoCost = 50;

const scoreText = document.getElementById("score");
const autoText = document.getElementById("autos");

function update(){
    scoreText.textContent = Math.floor(score);
    autoText.textContent = autoClickers;
}

function clickPoint(){
    score++;
    update();
}

function buyAuto(){
    if(score >= autoCost){
        score -= autoCost;
        autoClickers++;
        autoCost = Math.floor(autoCost * 1.5);

        document.querySelector(".upgrade").innerHTML =
        `🤖 Acheter AutoClicker (${autoCost})`;

        update();
    }
}

setInterval(() => {
    score += autoClickers;
    update();
}, 1000);

update();
</script>

</body>
</html>
