<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON CLICKER X</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}
  .panel{
width:min(95vw,500px);
max-height:95vh;
overflow-y:auto;
padding:25px;
border-radius:35px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.15);
box-shadow:
0 0 40px rgba(59,130,246,.4),
0 0 80px rgba(168,85,247,.2);
text-align:center;
}

.click-btn{
width:min(40vw,220px);
height:min(40vw,220px);
min-width:120px;
min-height:120px;
border:none;
border-radius:50%;
cursor:pointer;
font-size:clamp(25px,5vw,40px);
}

body{
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at top,#4f46e5 0%,#0f172a 30%,#020617 100%);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.bg{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.bg span{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
background:rgba(59,130,246,.15);
filter:blur(80px);
animation:float 12s infinite alternate;
}

.bg span:nth-child(1){
top:10%;
left:10%;
}

.bg span:nth-child(2){
bottom:10%;
right:10%;
background:rgba(168,85,247,.15);
}

@keyframes float{
from{transform:translateY(-50px);}
to{transform:translateY(50px);}
}
  .codes-box{
margin-top:25px;
padding:15px;
border-radius:20px;
background:rgba(255,255,255,.05);
}

.codes-box input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.1);
color:white;
outline:none;
}

.codes-box button{
margin-top:10px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(90deg,#f59e0b,#ef4444);
color:white;
}

#codeMessage{
margin-top:10px;
font-size:14px;
}

.panel{
width:500px;
padding:35px;
border-radius:35px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.15);
box-shadow:
0 0 40px rgba(59,130,246,.4),
0 0 80px rgba(168,85,247,.2);
text-align:center;
}

.logo{
font-size:42px;
font-weight:900;
letter-spacing:4px;
margin-bottom:15px;
background:linear-gradient(90deg,#38bdf8,#8b5cf6,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.score{
font-size:85px;
font-weight:900;
margin:20px 0;
text-shadow:
0 0 10px #38bdf8,
0 0 20px #38bdf8,
0 0 40px #38bdf8;
}

.cps{
color:#94a3b8;
margin-bottom:20px;
}

.click-btn{
width:220px;
height:220px;
border:none;
border-radius:50%;
cursor:pointer;
font-size:40px;
font-weight:900;
color:white;
background:
linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);
background-size:300% 300%;
animation:gradient 5s infinite;
box-shadow:
0 0 30px #3b82f6,
0 0 60px #8b5cf6,
0 0 100px rgba(236,72,153,.5);
transition:.15s;
}

.click-btn:hover{
transform:scale(1.08);
}

.click-btn:active{
transform:scale(.92);
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.shop{
margin-top:30px;
display:flex;
flex-direction:column;
gap:15px;
}

.upgrade{
padding:18px;
border:none;
border-radius:18px;
cursor:pointer;
font-size:16px;
font-weight:700;
color:white;
background:linear-gradient(90deg,#10b981,#06b6d4);
transition:.2s;
}

.upgrade:hover{
transform:translateY(-4px);
box-shadow:0 0 20px #06b6d4;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:25px;
}

.card{
padding:15px;
border-radius:18px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
}

.card h3{
font-size:14px;
color:#94a3b8;
margin-bottom:8px;
}

.card p{
font-size:25px;
font-weight:900;
}

</style>
</head>
<body>

<div class="bg">
<span></span>
<span></span>
</div>

<div class="panel">

<div class="logo">
⚡ NEON CLICKER X ⚡
</div>

<div id="score" class="score">0</div>

<div class="cps">
💸 Points automatiques : <span id="cps">0</span>/sec
</div>

<button class="click-btn" onclick="clickScore()">
⚡
</button>

<div class="shop">

<button class="upgrade" onclick="buyAuto()">
🤖 AUTOCLICKER • <span id="cost">50</span>
</button>

<button class="upgrade" onclick="buyMega()">
🚀 MEGA AUTOCLICKER • <span id="megacost">500</span>
</button>

</div>

<div class="stats">

<div class="card">
<h3>🤖 AutoClickers</h3>
<p id="autoCount">0</p>
</div>

<div class="card">
<h3>🚀 Mega</h3>
<p id="megaCount">0</p>
</div>
  <div class="codes-box">

    <h3>🎁 Codes</h3>

    <input
    type="text"
    id="codeInput"
    placeholder="Entrer un code">

    <button onclick="redeemCode()">
        Utiliser
    </button>

    <p id="codeMessage"></p>

</div>

</div>

</div>

<script>
  const codes = {
    "WELCOME":100,
    "NEON":500,
    "CLICKER":1000,
    "MEGA":5000,
    "SECRET2026":10000,
    "ADMIN":10000000000
};

const usedCodes = [];

function redeemCode(){

    const input =
    document.getElementById("codeInput")
    .value
    .toUpperCase()
    .trim();

    const msg =
    document.getElementById("codeMessage");

    if(usedCodes.includes(input)){
        msg.innerHTML = "❌ Code déjà utilisé";
        return;
    }

    if(codes[input]){

        score += codes[input];

        usedCodes.push(input);

        msg.innerHTML =
        "✅ +" + codes[input].toLocaleString() + " points";

        update();

    }else{

        msg.innerHTML = "❌ Code invalide";

    }

}

let score = 0;

let auto = 0;
let mega = 0;

let autoCost = 50;
let megaCost = 500;

function update(){

document.getElementById("score").innerHTML =
Math.floor(score).toLocaleString();

document.getElementById("autoCount").innerHTML = auto;
document.getElementById("megaCount").innerHTML = mega;

document.getElementById("cost").innerHTML =
autoCost.toLocaleString();

document.getElementById("megacost").innerHTML =
megaCost.toLocaleString();

document.getElementById("cps").innerHTML =
(auto + mega*10);
}

function clickScore(){

score++;

update();

}

function buyAuto(){

if(score >= autoCost){

score -= autoCost;

auto++;

autoCost = Math.floor(autoCost * 1.4);

update();

}

}

function buyMega(){

if(score >= megaCost){

score -= megaCost;

mega++;

megaCost = Math.floor(megaCost * 1.8);

update();

}

}

setInterval(()=>{

score += auto;
score += mega * 10;

update();

},1000);

update();

</script>

</body>
</html>
